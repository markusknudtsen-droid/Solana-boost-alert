name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Scope
    env:
      # Hoisted so the steps below can branch on whether it is configured;
      # the secrets context is not available in a step-level `if`.
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Temporary: report where the ntfy token actually landed. Only lengths
      # are printed, never values, so nothing sensitive is exposed.
      - name: Locate ntfy token
        env:
          AS_ENV_SECRET: ${{ secrets.NTFY_TOKEN }}
          AS_VARIABLE: ${{ vars.NTFY_TOKEN }}
          AS_LOWER: ${{ secrets.ntfy_token }}
          AS_ALT_NAME: ${{ secrets.NTFY_ACCESS_TOKEN }}
        run: |
          report() { if [ -n "$2" ]; then echo "$1: FOUND (length ${#2})"; else echo "$1: empty"; fi; }
          report "secrets.NTFY_TOKEN       " "$AS_ENV_SECRET"
          report "vars.NTFY_TOKEN          " "$AS_VARIABLE"
          report "secrets.ntfy_token       " "$AS_LOWER"
          report "secrets.NTFY_ACCESS_TOKEN" "$AS_ALT_NAME"
          echo "environment in use: Scope"

      # No ntfy token configured: deploy code only, leaving any secret
      # already set on the Worker untouched.
      - name: Deploy
        if: env.NTFY_TOKEN == ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_SCOPE }}
          wranglerVersion: "4"

      # Token configured: deploy and (re)upload it as an encrypted Cloudflare
      # secret. Doing it here rather than by hand in the dashboard means it is
      # reapplied on every deploy and cannot be clobbered by one.
      - name: Deploy with ntfy token
        if: env.NTFY_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_SCOPE }}
          wranglerVersion: "4"
          secrets: |
            NTFY_TOKEN
        env:
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
