name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Scope
    env:
      # Hoisted so the steps below can branch on whether it is configured;
      # the secrets context is not available in a step-level `if`.
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
      GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4

      # Temporary: check whether DexScreener is reachable from GitHub's
      # runner IPs, since the Cloudflare Worker is currently getting a
      # persistent Cloudflare-edge 429/1015 (rate limited) from it.
      - name: Diagnose DexScreener reachability from this runner
        run: |
          curl -sS -m 20 -w "\nHTTP_STATUS=%{http_code}\n" \
            "https://api.dexscreener.com/token-boosts/latest/v1" | tail -c 500

      # Always deploy code first. Cloudflare rejects a secret upload against a
      # Worker whose latest version isn't the one currently deployed ("code:
      # 10215"), which can happen after dashboard edits that create a version
      # without deploying it. Deploying here guarantees a clean baseline that
      # the secrets step below can safely attach to.
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_SCOPE }}
          wranglerVersion: "4"

      # Upload/refresh the ntfy token as an encrypted Cloudflare secret.
      # Doing it here rather than by hand in the dashboard means it is
      # reapplied on every deploy and cannot be silently clobbered.
      - name: Upload ntfy token
        if: env.NTFY_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_SCOPE }}
          wranglerVersion: "4"
          secrets: |
            NTFY_TOKEN
        env:
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}

      # Upload/refresh the GitHub dispatch token as an encrypted Cloudflare
      # secret. The Worker's Cron Trigger uses this to call GitHub's
      # workflow_dispatch API every 5 minutes, working around GitHub's own
      # unreliable schedule event (observed 2-12 hour real gaps).
      - name: Upload GitHub dispatch token
        if: env.GH_DISPATCH_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_SCOPE }}
          wranglerVersion: "4"
          secrets: |
            GH_DISPATCH_TOKEN
        env:
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}

      # Upload/refresh the ntfy topic as an encrypted Cloudflare secret.
      # This used to be a plaintext var in wrangler.toml, which is fine for
      # a private repo but not once the repo is public (this repo is, to
      # avoid GitHub Actions' private-repo minute quota) -- the topic name
      # is the only thing standing between "your alerts" and anyone who
      # finds the repo being able to read or spoof them on ntfy.sh.
      - name: Upload ntfy topic
        if: env.NTFY_TOPIC != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_SCOPE }}
          wranglerVersion: "4"
          secrets: |
            NTFY_TOPIC
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
